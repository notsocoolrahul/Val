<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 40px;
    }

    .buttons {
      position: relative;
      width: 420px;
      height: 220px;
    }

    button {
      position: absolute;
      padding: 14px 34px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #yes {
      left: 40px;
      top: 90px;
      background: #ff4d6d;
      color: white;
      transition: transform 0.25s ease;
    }

    #no {
      left: 220px;
      top: 90px;
      background: #555;
      color: white;
      transform: scale(1) !important; /* HARD LOCK */
    }

    #message {
      display: none;
      font-size: 28px;
      margin-top: 40px;
      text-align: center;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 3s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-320px) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <h1>Will you be my Valentine? 💘</h1>

  <div class="buttons" id="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>

  <div id="message">
    Of course I knew you would say yes 😌❤️
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const buttons = document.getElementById("buttons");
    const message = document.getElementById("message");

    let yesScale = 1;

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      message.style.display = "block";
      startHearts();
    });

    // 🚨 THIS is the key fix
    noBtn.addEventListener("mouseenter", () => {
      teleportNo();
      growYesSlowly();
    });

    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      teleportNo();
      growYesSlowly();
    });

    function teleportNo() {
      const container = buttons.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      // Disable hover for a moment so cursor can’t catch it
      noBtn.style.pointerEvents = "none";

      const newX = Math.random() * (container.width - btn.width);
      const newY = Math.random() * (container.height - btn.height);

      noBtn.style.left = newX + "px";
      noBtn.style.top = newY + "px";

      // Re-enable hover after jump
      setTimeout(() => {
        noBtn.style.pointerEvents = "auto";
      }, 120);
    }

    function growYesSlowly() {
      if (yesScale < 1.35) {
        yesScale += 0.015;
        yesBtn.style.transform = `scale(${yesScale})`;
      }
    }

    function startHearts() {
      const interval = setInterval(() => {
        for (let i = 0; i < 6; i++) createHeart();
      }, 250);

      setTimeout(() => clearInterval(interval), 3000);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.fontSize = 20 + Math.random() * 25 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 3000);
    }
  </script>
</body>
</html>
