<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 40px;
    }

    .buttons {
      position: relative;
      width: 400px;
      height: 200px;
    }

    button {
      position: absolute;
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yes {
      left: 30px;
      top: 80px;
      background: #ff4d6d;
      color: white;
      z-index: 1;
      transition: transform 0.2s ease;
    }

    #no {
      right: 30px;
      top: 80px;
      background: #555;
      color: white;
      z-index: 2;
      transition: left 0.15s ease, top 0.15s ease;
      transform: scale(1); /* HARD LOCK */
    }

    #message {
      display: none;
      font-size: 28px;
      margin-top: 40px;
      text-align: center;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 3s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-320px) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine? 💘</h1>

  <div class="buttons" id="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>

  <div id="message">
    Of course I knew you would say yes 😌❤️
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const buttons = document.getElementById("buttons");
    const message = document.getElementById("message");

    let yesScale = 1;

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      message.style.display = "block";
      startHearts();
    });

    document.addEventListener("mousemove", evadeCursor);
    noBtn.addEventListener("touchstart", evadeTouch);

    function evadeCursor(e) {
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 150) {
        jumpNoButton(dx, dy);
        growYesSlowly();
      }
    }

    function evadeTouch(e) {
      e.preventDefault();
      jumpNoButton(
        Math.random() * 400 - 200,
        Math.random() * 200 - 100
      );
      growYesSlowly();
    }

    function jumpNoButton(dx, dy) {
      const container = buttons.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      // Force scale reset (extra safety)
      noBtn.style.transform = "scale(1)";

      let newX = noBtn.offsetLeft - dx * 2.2;
      let newY = noBtn.offsetTop - dy * 2.2;

      newX = Math.max(0, Math.min(container.width - btn.width, newX));
      newY = Math.max(0, Math.min(container.height - btn.height, newY));

      noBtn.style.left = newX + "px";
      noBtn.style.top = newY + "px";
    }

    function growYesSlowly() {
      if (yesScale < 1.35) {
        yesScale += 0.01; // SLOW growth
        yesBtn.style.transform = `scale(${yesScale})`;
      }
    }

    function startHearts() {
      const interval = setInterval(() => {
        for (let i = 0; i < 6; i++) createHeart();
      }, 250);

      setTimeout(() => clearInterval(interval), 3000);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.fontSize = 20 + Math.random() * 25 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 3000);
    }
  </script>

</body>
</html>
